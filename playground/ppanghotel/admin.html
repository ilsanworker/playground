<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e9f0e8"><title>관리자 · BBANGBBANG HOTEL</title>
<style>
:root{--bg:#f6f7f2;--paper:#fff;--ink:#20251f;--muted:#747b70;--green:#dce9dc;--deep:#42634a;--line:#e7e9e1;--radius:24px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55}
button,input{font:inherit}.wrap{width:min(900px,calc(100% - 30px));margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:25px 0}.brand{font-weight:850;letter-spacing:-.5px}.brand span{display:inline-grid;place-items:center;background:var(--green);width:34px;height:34px;border-radius:12px;margin-right:8px}
a{color:var(--deep);text-decoration:none;font-size:14px;font-weight:700}.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:25px;margin:20px 0}h1{font-size:clamp(30px,5vw,44px);line-height:1.1;letter-spacing:-1.7px;margin:10px 0}h2{margin:0 0 8px;letter-spacing:-.7px}.muted{color:var(--muted);font-size:14px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:750}input{border:1px solid #dfe3d9;border-radius:13px;padding:13px;background:#fcfcfa;width:100%}input:focus{outline:2px solid #dce9dc;border-color:#7c9c7e}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:750;cursor:pointer}.primary{background:var(--deep);color:white}.secondary{background:var(--green);color:var(--deep)}.danger{background:#f7e3e0;color:#a23f36}.login{max-width:430px;margin:45px auto}.hidden{display:none!important}.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.list{display:grid;gap:12px;margin-top:18px}.reservation{border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px}.reservation p{margin:5px 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.pill{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:#f5e6c2;color:#735a21;white-space:nowrap}.pill.confirmed{background:#d7ead6;color:#315b37}.pill.cancelled{background:#eee;color:#777}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.small{padding:8px 11px;border-radius:11px;font-size:12px;font-weight:750;border:0;cursor:pointer}.empty{padding:20px;border-radius:16px;background:#f6f7f2;color:var(--muted);text-align:center}.notice{padding:14px 16px;border-radius:15px;background:#f0ead9;color:#615a48;font-size:13px;margin-top:14px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#20251f;color:white;padding:12px 17px;border-radius:14px;display:none;z-index:5;max-width:calc(100% - 30px);font-size:14px}
@media(max-width:620px){.reservation{grid-template-columns:1fr}.panel{padding:18px}.login{margin:25px auto}}
</style></head>
<body><div class="wrap">
<header><div class="brand"><span>💩</span> BBANGBBANG HOTEL</div><a href="index.html">← 호텔로 돌아가기</a></header>
<section id="loginPanel" class="panel login">
 <div style="font-size:34px">👑</div><h1>관리자 로그인</h1><p class="muted">황금똥빵 전용 예약 관리 페이지입니다.</p>
 <form id="loginForm">
  <div class="field"><label for="email">관리자 이메일</label><input id="email" type="email" autocomplete="username" required placeholder="관리자 이메일"></div>
  <div class="field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required placeholder="비밀번호"></div>
  <button class="btn primary" style="width:100%" type="submit">로그인</button>
 </form>
 <div class="notice">이 계정은 Supabase 대시보드에서 직접 만든 관리자 계정이어야 합니다. 일반 방문자는 관리자 권한이 없습니다.</div>
</section>
<section id="adminPanel" class="panel hidden">
 <div class="toprow"><div><h2>예약 관리</h2><div class="muted">예약을 확인하고 확정 또는 취소할 수 있습니다.</div></div><button class="btn secondary" id="logoutBtn">로그아웃</button></div>
 <div class="notice">승인 대기 중인 예약도 날짜를 점유합니다. 취소하면 해당 날짜는 다시 예약할 수 있습니다.</div>
 <div class="list" id="reservationList"><div class="empty">예약을 불러오는 중…</div></div>
</section>
<footer class="muted" style="padding:25px 0 35px;border-top:1px solid var(--line)">💩 BBANGBBANG HOTEL</footer>
</div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Use the same project URL and Publishable key as index.html. */
const SUPABASE_URL="https://uwcgnlxdaohzjuoejxrq.supabase.co/rest/v1/";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_G6I6GLst0-ANx2zlfxS1uw_dxtq88MX";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
function configured(){return !SUPABASE_URL.includes("YOUR-PROJECT-REF")&&!SUPABASE_PUBLISHABLE_KEY.includes("YOUR_SUPABASE")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function label(s){return s==="pending"?"승인 대기":s==="confirmed"?"예약 확정":"취소됨"}
function cls(s){return s==="confirmed"?"confirmed":s==="cancelled"?"cancelled":""}
function toast(msg){const t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",4000)}
async function checkAdmin(){
 const {data:{session}}=await client.auth.getSession();
 if(!session){$("loginPanel").classList.remove("hidden");$("adminPanel").classList.add("hidden");return false}
 const {data,error}=await client.rpc("is_admin");
 if(error||!data){$("loginPanel").classList.remove("hidden");$("adminPanel").classList.add("hidden");await client.auth.signOut();toast("이 계정에는 관리자 권한이 없습니다.");return false}
 $("loginPanel").classList.add("hidden");$("adminPanel").classList.remove("hidden");await loadReservations();return true
}
async function loadReservations(){
 $("reservationList").innerHTML='<div class="empty">예약을 불러오는 중…</div>';
 const {data,error}=await client.from("reservations").select("id,name,age,check_in,check_out,gender,dorm,memo,status,created_at").order("created_at",{ascending:false});
 if(error){$("reservationList").innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}
 if(!data.length){$("reservationList").innerHTML='<div class="empty">예약 신청이 아직 없습니다.</div>';return}
 $("reservationList").innerHTML=data.map(r=>`<article class="reservation"><div><strong>${esc(r.name)}</strong> <span class="pill ${cls(r.status)}">${label(r.status)}</span><p>${esc(r.check_in)} → ${esc(r.check_out)} · 만 ${esc(r.age)}세 · ${r.gender==="male"?"남성":"기타"} · ${r.dorm==="yes"?"기숙사 사생":"사생 아님"}</p><p>${esc(r.memo||"전달 사항 없음")}</p><p>신청: ${esc((r.created_at||"").replace("T"," ").slice(0,16))}</p></div><div class="actions">${r.status==="pending"?`<button class="small" style="background:#dcebd9;color:#315b37" onclick="setStatus('${r.id}','confirmed')">확정</button>`:""}${r.status!=="cancelled"?`<button class="small" style="background:#f7e3e0;color:#a23f36" onclick="setStatus('${r.id}','cancelled')">취소</button>`:""}${r.status==="cancelled"?`<button class="small" style="background:#eee" onclick="deleteReservation('${r.id}')">삭제</button>`:""}</div></article>`).join("");
}
async function setStatus(id,status){
 const {error}=await client.from("reservations").update({status}).eq("id",id);
 if(error){toast(error.message);return}
 await loadReservations();
 if(status==="confirmed")alert("🎉 축하합니다! 예약이 확정되셨습니다!\n\n아래 주의사항을 다시 한 번 읽어주세요!\n\n그때 뵙겠습니다~");
 else toast("예약이 취소되었습니다.");
}
async function deleteReservation(id){
 if(!confirm("이 예약 기록을 완전히 삭제할까요?"))return;
 const {error}=await client.from("reservations").delete().eq("id",id);
 if(error){toast(error.message);return}await loadReservations();toast("예약 기록을 삭제했습니다.");
}
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();if(!configured()){toast("README.md의 Supabase 설정을 먼저 완료해주세요.");return}
 const {error}=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 if(error){toast("로그인 실패: "+error.message);return}
 await checkAdmin();
});
$("logoutBtn").addEventListener("click",async()=>{await client.auth.signOut();await checkAdmin()});
(async()=>{if(!configured()){toast("Supabase URL과 Publishable key를 설정해주세요.");return}await checkAdmin()})();
</script></body></html>
