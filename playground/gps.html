
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS 테스트</title>
<style>
body {
  font-family: -apple-system, sans-serif;
  padding: 30px;
  background: #fff;
  color: #222;
}
button {
  width: 100%;
  padding: 17px;
  border: 0;
  border-radius: 14px;
  background: #1677ff;
  color: white;
  font-size: 16px;
}
#result {
  margin-top: 25px;
  padding: 20px;
  background: #f3f4f6;
  border-radius: 14px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>

<h2>📍 GPS 위치 테스트</h2>
<p>버튼을 누르고 위치정보 접근을 허용해 주세요.</p>

<button onclick="getLocation()">현재 위치 가져오기</button>

<div id="result">아직 위치정보를 가져오지 않았습니다.</div>

<script>
function getLocation() {
  const result = document.getElementById("result");

  result.innerHTML = "📡 GPS 위치 측정 중...";

  if (!window.isSecureContext) {
    result.innerHTML = "❌ HTTPS 환경이 아닙니다.";
    return;
  }

  if (!navigator.geolocation) {
    result.innerHTML = "❌ Geolocation API를 지원하지 않습니다.";
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      result.innerHTML = `
        <h3>✅ 위치 확인 성공!</h3>
        위도: ${lat}<br>
        경도: ${lng}<br>
        정확도: 약 ${Math.round(accuracy)}m<br><br>
        <a href="https://www.google.com/maps?q=${lat},${lng}">
          Google 지도에서 확인하기
        </a>
      `;
    },
    (error) => {
      const errors = {
        1: "위치정보 접근이 거부되었습니다.",
        2: "현재 위치를 확인할 수 없습니다.",
        3: "위치정보 요청 시간이 초과되었습니다."
      };

      result.innerHTML = `
        ❌ GPS 오류<br>
        코드: ${error.code}<br>
        원인: ${errors[error.code] || error.message}<br>
        상세: ${error.message}
      `;
    },
    {
      enableHighAccuracy: true,
      timeout: 30000,
      maximumAge: 0
    }
  );
}
</script>

</body>
</html>
